<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>İslam Medeniyetinin 30 Bilim Öncüsü</title><style>body{background:#081526;color:#f6eac9;font:18px system-ui;display:grid;place-items:center;min-height:90vh}p{text-align:center}</style></head><body><p id="status">Bilim insanları ve görseller yükleniyor…</p><script>(async()=>{try{const paths=Array.from({length:16},(_,i)=>'site-parts/part-'+String(i).padStart(2,'0')+'.txt');const responses=await Promise.all(paths.map(p=>fetch(p,{cache:'no-store'})));for(const r of responses)if(!r.ok)throw Error('Dosya yüklenemedi: '+r.url);const parts=await Promise.all(responses.map(r=>r.text()));const html=parts.join('');if(!html.includes('</html>'))throw Error('Eksik içerik');document.open();document.write(html);document.close()}catch(e){document.getElementById('status').textContent='Site yüklenemedi. Sayfayı yenileyin. '+e.message;console.error(e)}})();</script></body></html>
